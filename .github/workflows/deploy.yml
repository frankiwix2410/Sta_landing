name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR solo acepta nombres en minúscula y el repo es "Sta_landing".
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          # Si un secret se guarda con un salto de línea al final, curl rechaza
          # la cabecera y sale con el código 43. Ninguno de los tres valores
          # lleva espacios legítimos, así que se limpian enteros.
          url=$(printf '%s' "$DOKPLOY_URL" | tr -d '[:space:]' | sed 's:/*$::')
          key=$(printf '%s' "$DOKPLOY_API_KEY" | tr -d '[:space:]')
          app=$(printf '%s' "$DOKPLOY_APP_ID" | tr -d '[:space:]')

          curl -sS -L --fail-with-body -X POST "$url/api/application.deploy" \
            -H "x-api-key: $key" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$app\"}"
